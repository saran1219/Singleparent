# Render blueprint for backend deployment
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: singleparent-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
